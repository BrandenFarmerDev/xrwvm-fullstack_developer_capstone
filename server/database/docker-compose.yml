services:
  # Mongodb service
  mongo_db:
    container_name: course12-mongo
    image: mongo:latest
    restart: always
    volumes:
      - mongo_data:/data/db

  # Node api service
  api:
    image: course12-nodeapp
    container_name: course12-api
    ports:
      - 3030:3030
    depends_on: 
      - mongo_db

volumes:
  mongo_data: {}
