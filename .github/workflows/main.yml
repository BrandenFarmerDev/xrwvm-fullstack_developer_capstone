name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python Files and Test Django
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r server/requirements.txt flake8
      - name: Run Linter
        run: python -m flake8 server --exclude=node_modules,build
      - name: Check Django configuration
        working-directory: server
        run: python manage.py check
      - name: Test authentication and inventory
        working-directory: server
        run: python manage.py test djangoapp --verbosity 2

  lint_js:
    name: Lint JavaScript Files and Build React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JSHint
        working-directory: server/database
        run: npm ci --no-audit --no-fund
      - name: Run Linter
        working-directory: server/database
        run: npx jshint app.js review.js dealership.js inventory.js
      - name: Install React dependencies
        working-directory: server/frontend
        run: npm ci --no-audit --no-fund
      - name: Build React
        working-directory: server/frontend
        run: npm run build

